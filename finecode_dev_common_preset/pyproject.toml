[project]
name = "finecode_dev_common_preset"
version = "0.3.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
dependencies = [
  "fine_agent~=0.1.0",
  "fine_dep_graph~=0.1.0",
  "fine_git_hooks~=0.1.0",
  "fine_logs~=0.1.0",
  "fine_python_recommended~=0.5.0",
  "fine_release~=0.1.0",
]

[project.optional-dependencies]
aksem = ["fine_python_aksem~=0.3.0a3"]
lint_fix = ["fine_lint_fix~=0.1.0a0"]

[dependency-groups]
dev_workspace = ["finecode~=0.4.0", "finecode_dev_common_preset~=0.3.0"]

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14",
  "cpython@3.15"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.setuptools.package-data]
finecode_dev_common_preset = ["preset.toml"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
