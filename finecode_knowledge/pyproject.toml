[project]
name = "finecode_knowledge"
version = "0.1.0a0"
description = "Knowledge model engine for FineCode: entity/fact model, query IR and interpreter, memoization DAG. Carries no schema of its own -- a schema is declared by a separate package and handed to it (R20)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
# Deliberately empty: the engine is stdlib-only. The WM imports it, so every
# dependency added here lands in the WM's own environment.
dependencies = []

[dependency-groups]
dev_workspace = ["finecode~=0.4.0a0", "finecode_dev_common_preset~=0.3.0a0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finecode_knowledge = ["py.typed"]
