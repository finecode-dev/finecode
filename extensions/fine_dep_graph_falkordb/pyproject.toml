[project]
name = "fine_dep_graph_falkordb"
version = "0.1.0a0"
description = "FalkorDB handler implementations for FineCode dependency graph actions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
dependencies = [
  "falkordb>=1.0.0,<2.0.0",
  "fine_dep_graph~=0.1.0a0",
  "finecode_extension_api~=0.4.0a0",
]

[project.entry-points."finecode.activator"]
fine_dep_graph_falkordb = "fine_dep_graph_falkordb.activator:Activator"

[dependency-groups]
dev_workspace = ["finecode~=0.4.0a0", "finecode_dev_common_preset~=0.3.0a0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.setuptools]
packages = ["fine_dep_graph_falkordb"]

[tool.setuptools.package-data]
fine_dep_graph_falkordb = ["py.typed"]
