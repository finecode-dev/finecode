[tool.finecode]
# fine_python_src_artifacts registers get_src_artifact_toolchain_range's Python handler,
# which is where the linters' language level comes from when it is not configured
presets = [{ source = "fine_lint" }, { source = "fine_python_src_artifacts" }]

[tool.finecode.action.lint_python_files]
source = "fine_python_lang.LintPythonFilesAction"
handlers = [
  { name = "ruff", source = "fine_python_ruff.RuffLintFilesHandler", env = "dev_no_runtime", dependencies = [
    "fine_python_ruff[jsonrpc]~=0.2.0a0",
  ] },
  { name = "flake8", source = "fine_python_flake8.Flake8LintFilesHandler", env = "dev_no_runtime", dependencies = [
    "fine_python_flake8~=0.3.0a0",
  ] },
]

[tool.finecode.action.get_lint_fixes_python_files]
source = "fine_python_lang.GetLintFixesPythonFilesAction"
handlers = [
  { name = "ruff", source = "fine_python_ruff.RuffGetLintFixesHandler", env = "dev_no_runtime", dependencies = [
    "fine_python_ruff[jsonrpc]~=0.2.0a0",
  ] },
]

[tool.finecode.extension.fine_python_ruff]
dependencies_override = ["ruff==0.16.*"]

[tool.finecode.extension.fine_python_flake8]
dependencies_override = ["flake8==7.3.*"]

[[tool.finecode.action_handler]]
source = "fine_python_ruff.RuffLintFilesHandler"
# PLC0415 (import-outside-top-level): Checks for import statements outside of a module's
#                                     top-level scope, such as within a function or
#                                     class definition.
# PLE:     pylint errors only — no style, no refactor suggestions.
# ASYNC:   blocking calls and busy-waits inside async functions.
# RUF:     ruff-specific rules. RUF006 (asyncio task not stored -> may be garbage-collected
#          mid-flight) and RUF022 (`__all__` not sorted) are the notable ones.
# DTZ:     timezone-naive datetime construction.
config.extend_select = [
  "B",
  "I",
  "PLC0415",
  "PLE",
  "ASYNC",
  "UP",
  "DTZ",
  "C4",
  "PIE",
  "PERF",
  "FURB",
  "SIM",
  "RUF",
  "FLY",
  "INT",
  "ICN",
  "TID",
  "PGH",
  "LOG",
]
# ASYNC109: `timeout` parameter on async defs — trio convention, not asyncio.
# RUF002/RUF003: ambiguous unicode — false positives in non-English projects.
# PLC0414: redundant alias is the PEP 484 explicit-re-export idiom outside of __init__.py,
#          where ruff already exempts it.
# extend_ignore, not ignore: a universal preset cannot know which rules a project has
# already excused itself from, and `ignore` replaces that list rather than adding to it.
config.extend_ignore = ["ASYNC109", "RUF002", "RUF003", "PLC0414"]

# flake8 is used only for custom rules, all standard rules are checked by ruff, but
# keep flake8 configuration if someone activates some rules or uses flake8 config
# parameters in their own rules
[[tool.finecode.action_handler]]
source = "fine_python_flake8.Flake8LintFilesHandler"
config.max_line_length = 80
# W391 is not compatible with black(and ruff formatter, which is compatible with black),
# because black adds an empty line to the end of the file
# TODO: move in recommended config once config merging is implemented
config.extend_ignore = ["E203", "E501", "E701", "W391"]
# disable all standard rules
config.select = []

[[tool.finecode.action_handler]]
source = "fine_python_pip.PipInstallDepsInEnvHandler"
# use compat editable mode because some static analysis tools like pyrefly support
# only .pth files with pathes, not with executable code lines:
# https://pyrefly.org/en/docs/import-resolution/#editable-installs
# another possibility is strict mode, but it doesn't work in this case, because it
# creates editable directory directly in the package and if the package is installed
# as editable in multiple packages, there are concurrency problems and it would require
# sequential installation of dependencies in all envs.
config.editable_mode = "compat"

[[tool.finecode.service]]
interface = "finecode_extension_api.interfaces.ijsonrpcclient.IJsonRpcClient"
source = "finecode_jsonrpc.jsonrpc_client.JsonRpcClientImpl"
env = "dev_no_runtime"
dependencies = ["finecode_jsonrpc~=0.1.0a1"]

[[tool.finecode.service]]
interface = "finecode_extension_api.interfaces.ilspclient.ILspClient"
source = "finecode_extension_runner.impls.lsp_client.LspClientImpl"
env = "dev_no_runtime"
dependencies = []
