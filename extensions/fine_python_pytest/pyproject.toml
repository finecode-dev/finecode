[project]
name = "fine_python_pytest"
version = "0.1.0a0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
# pytest changelog: https://docs.pytest.org/en/stable/changelog.html
dependencies = [
  "fine_test~=0.1.0a0",
  "finecode_extension_api~=0.4.0a0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-json-report>=1.5.0",
]

[dependency-groups]
dev_workspace = ["finecode~=0.4.0a0", "finecode_dev_common_preset~=0.3.0a0"]

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.setuptools]
packages = ["fine_python_pytest"]
