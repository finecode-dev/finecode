[project]
name = "fine_agent_claude_code"
version = "0.1.0a0"
description = "FineCode handlers for the Claude Code CLI: install it and run agent tasks"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
dependencies = [
  "fine_agent~=0.1.0a0",
  "fine_system_setup~=0.1.0a0",
  "finecode_extension_api~=0.4.0a0"
]

[dependency-groups]
dev_workspace = ["finecode~=0.4.0a0", "finecode_dev_common_preset~=0.3.0a0"]

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.setuptools]
packages = ["fine_agent_claude_code"]
