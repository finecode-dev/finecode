[project]
name = "fine_lint"
version = "0.1.0a0"
description = "FineCode preset that owns linting action contracts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
dependencies = [
  "fine_inspect_code~=0.1.0a0",
  "fine_src_artifacts~=0.1.0a0",
  "finecode_extension_api~=0.5.0a0"
]

[dependency-groups]
dev_workspace = ["finecode~=0.4.0a0", "finecode_dev_common_preset~=0.3.0a0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.setuptools]
packages = ["fine_lint"]

[tool.setuptools.package-data]
fine_lint = ["preset.toml"]
