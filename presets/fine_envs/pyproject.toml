[project]
name = "fine_envs"
version = "0.2.0a0"
description = "FineCode preset that owns environment management and configuration action contracts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
dependencies = [
  "fine_src_artifacts~=0.1.0a0",
  "finecode_extension_api~=0.4.0a0",
  "packaging>=23.0",
  "tomlkit==0.11.*",
  "typing-extensions (>=4.12.2,<5.0.0)",
]

# `check_toolchains_audit_code_bridge_handler` reports axis drift as an audit_code
# finding. It is the only module here that needs the audit umbrella, and fine_envs is
# the mandatory base preset every project loads, so the dependency stays optional:
# whoever registers that handler asks for `fine_envs[audit]`.
[project.optional-dependencies]
audit = ["fine_audit_code~=0.1.0a0", "fine_inspect_code~=0.1.0a0"]

[dependency-groups]
dev_workspace = ["finecode~=0.4.0a0", "finecode_dev_common_preset~=0.3.0a0"]
# The bridge handler's unit test imports it, so its optional deps must be present in
# the env that runs the tests.
testing = ["fine_audit_code~=0.1.0a0", "fine_inspect_code~=0.1.0a0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.setuptools]
packages = ["fine_envs"]

[tool.setuptools.package-data]
fine_envs = ["preset.toml"]
