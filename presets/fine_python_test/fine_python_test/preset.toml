# fine_python_envs declares the sync_python_interpreters action/handler that
# derives the `testing` env's interpreter axis from `requires-python` (ADR-0053).
[tool.finecode]
presets = [{ source = "fine_python_envs" }]

# `run_tests` runs in the `testing` matrix env (declared below): its pytest
# handler runs once per supported interpreter (ADR-0047/0057). `list_tests` stays
# single-env on `dev` — discovery is not something to fan out per interpreter.
[tool.finecode.action.run_tests]
source = "fine_test.RunTestsAction"
handlers = [
    { name = "pytest", source = "fine_python_pytest.PytestRunTestsHandler", env = "testing", dependencies = [
        "fine_python_pytest~=0.1.0a0",
    ] },
]

[tool.finecode.action.list_tests]
source = "fine_test.ListTestsAction"
handlers = [
    { name = "pytest", source = "fine_python_pytest.PytestListTestsHandler", env = "dev", dependencies = [
        "fine_python_pytest~=0.1.0a0",
    ] },
]

[tool.finecode.extension.fine_python_pytest]
dependencies_override = ["pytest==9.0.*"]

# Run every collected async test via pytest-asyncio without requiring each
# consumer project to declare `@pytest.mark.asyncio` or an ini/CLI option.
[[tool.finecode.action_handler]]
source = "fine_python_pytest.PytestRunTestsHandler"
config.addopts = ["--asyncio-mode=auto"]

[[tool.finecode.action_handler]]
source = "fine_python_pytest.PytestListTestsHandler"
config.addopts = ["--asyncio-mode=auto"]

# ADR-0046: the pytest handlers above import the project under test, so these
# envs opt into installing it (editable, from its own directory). Consumers who
# install it some other way can override with install_project = false in their
# own pyproject.toml.
#
# `dev` carries list_tests (single-interpreter discovery).
[tool.finecode.env.dev]
install_project = true

# `testing` carries run_tests as a matrix env. Its interpreter axis is not
# written by hand — it is derived by the
# sync_python_interpreters handler configured below (ADR-0053). A plain local run
# uses only the newest interpreter; CI runs the full axis (the absent `ci` key
# falls back to "all"). See ADR-0057 for why tests get their own matrix env.
[tool.finecode.env.testing]
install_project = true

[tool.finecode.env.testing.default_interpreters]
local = "newest"

# Derive `testing`'s axis. `envs` is a list, so additional
# matrix envs (e.g. a future build matrix) subscribe to the same derived axis
# here without restating any version list (ADR-0057).
[tool.finecode.action.sync_python_interpreters.handlers.sync_python_interpreters]
config.envs = ["testing"]
