[project]
name = "finecode_extension_api"
version = "0.6.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
dependencies = ["typing-extensions (>=4.12.2,<5.0.0)"]

[dependency-groups]
dev_workspace = ["finecode~=0.4.0", "finecode_dev_common_preset~=0.3.0"]

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.importlinter]
root_package = "finecode_extension_api"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "extension-api-no-runtime"
name = "extension API stays runtime-neutral: no runner or OTel imports"
type = "forbidden"
source_modules = ["finecode_extension_api"]
forbidden_modules = ["finecode_extension_runner", "opentelemetry"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
