[project]
name = "finecode_common"
version = "0.1.0"
description = "Shared stdlib-plus-psutil internals for FineCode: event-loop lag mechanics and host readers. Imports neither FineCode packages nor OpenTelemetry."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Hnatiuk", email = "aders1234@gmail.com" }]
dependencies = [
  "psutil==7.2.*",
]

[dependency-groups]
dev_workspace = ["finecode~=0.4.0", "finecode_dev_common_preset~=0.3.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.finecode]
presets = [{ source = "finecode_dev_common_preset" }]

[tool.finecode.env.testing]
interpreters = [
  "cpython@3.11",
  "cpython@3.12",
  "cpython@3.13",
  "cpython@3.14",
  "cpython@3.15"
]  # generated by sync_toolchains from requires-python -- run sync_toolchains to update

[tool.importlinter]
root_package = "finecode_common"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "finecode-common-is-leaf"
name = "finecode_common is a leaf: no FineCode, extension or OpenTelemetry imports"
type = "forbidden"
source_modules = ["finecode_common"]
forbidden_modules = [
  "finecode",
  "finecode_extension_api",
  "finecode_extension_runner",
  "fine_agent",
  "fine_agent_claude_code",
  "fine_agent_codex",
  "fine_agent_pi",
  "fine_audit_code",
  "fine_check_imports",
  "fine_code_hierarchy",
  "fine_dep_graph",
  "fine_dep_graph_falkordb",
  "fine_dist_artifacts",
  "fine_docs",
  "fine_docs_markdown",
  "fine_docs_mkdocs",
  "fine_envs",
  "fine_format",
  "fine_git",
  "fine_git_hooks",
  "fine_inlay_hints",
  "fine_inspect_code",
  "fine_knowledge",
  "fine_lint",
  "fine_logs",
  "fine_python_aksem",
  "fine_python_ast",
  "fine_python_black",
  "fine_python_check_imports",
  "fine_python_code_hierarchy",
  "fine_python_envs",
  "fine_python_flake8",
  "fine_python_format",
  "fine_python_import_linter",
  "fine_python_inlay_hints",
  "fine_python_isort",
  "fine_python_lang",
  "fine_python_lint",
  "fine_python_module_exports",
  "fine_python_mypy",
  "fine_python_package_info",
  "fine_python_pip",
  "fine_python_pyrefly",
  "fine_python_pytest",
  "fine_python_recommended",
  "fine_python_ruff",
  "fine_python_semantic_tokens",
  "fine_python_setuptools_scm",
  "fine_python_src_artifacts",
  "fine_python_symbol_info",
  "fine_python_test",
  "fine_python_type_check",
  "fine_python_uv",
  "fine_python_virtualenv",
  "fine_release",
  "fine_semantic_tokens",
  "fine_src_artifacts",
  "fine_symbol_info",
  "fine_system_setup",
  "fine_test",
  "fine_toml_lang",
  "fine_toml_recommended",
  "fine_toml_tombi",
  "fine_type_check",
  "fine_wal_events",
  "fine_wal_explorer",
  "opentelemetry",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finecode_common = ["py.typed"]
